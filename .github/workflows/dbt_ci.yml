name: dbt CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 dbt 与 DuckDB 适配器
        # 版本必须与本地开发环境一致，锁死。
        # 不锁版本的 CI 会被上游更新无声破坏——这是真实事故来源。
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.6" "dbt-duckdb==1.11.0"

      - name: 生成样例数据（EL 环节，在 dbt 之外）
        # 库名必须和下面的 --target ci 一致（ci.duckdb）
        run: python scripts/gen_sample_data.py ci.duckdb

      - name: 构建模型 + 快照 + 测试
        run: dbt build --target ci
        env:
          DBT_PROFILES_DIR: .

      - name: 生成文档产物
        if: always()
        run: dbt docs generate --target ci
        env:
          DBT_PROFILES_DIR: .

      - name: 上传 dbt 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: target/
