version: 2                      # 固定写法
sources:
  - name: raw                  # 源名称，你自己起（建议 raw）
    schema: main                 # 第 1 步查出来的 schema
    tables:
      - name: raw_carriers               # 第 1 步查出来的表名
      - name: raw_flights
models:
  - name: stg_flights          # 必须等于文件名 stg_flights.sql
    description: 航班明细清洗层
    columns:
      - name: flight_id
        description: 航班唯一标识
        data_tests:
          - unique             # 无参数，直接写一行
          - not_null

      - name: carrier_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:       # ← 这个坑，别漏
                values: ['AA', 'DL', 'UA', 'WN']
                quote: true

  - name: stg_carriers
    columns:
      - name: carrier_code
        data_tests:
          - unique
          - not_null
      - name: carrier_name
        data_tests:
          - not_null