version: 2

models:
  - name: mart_carrier_daily
    description: >
      航司 x 日 经营汇总宽表。只含可加度量；
      客座率等比率指标在 W5 加入时，必须同时落分子（RPK）和分母（ASK）。
    columns:
      - name: flight_date
        description: 航班日期
        data_tests: [not_null]
      - name: carrier_code
        description: 航司 IATA 二字代码
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_carriers')
                field: carrier_code
      - name: flight_count
        description: 当日航班总数（含取消）
        data_tests: [not_null]
      - name: total_revenue
        description: 当日客运收入合计
