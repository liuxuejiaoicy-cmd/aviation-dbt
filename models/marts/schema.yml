version: 2

models:
  - name: mart_carrier_daily        # 必须等于文件名
    description: 航司×日 运营汇总（增量模型）
    columns:
      - name: flight_date
        description: 航班日期
        data_tests:
          - not_null

      - name: carrier_code
        description: 航司 IATA 二字代码
        data_tests:
          - not_null
          - relationships:
              arguments:            # ← 别忘了这层
                to: ref('stg_carriers')
                field: carrier_code

      - name: flight_count
        description: 当日航班数
        data_tests:
          - not_null
